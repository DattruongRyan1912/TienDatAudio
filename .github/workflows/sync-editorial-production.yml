name: Sync editorial production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full Git SHA of the active production release
        required: true
        type: string
      confirmation:
        description: Type SYNC-100-PUBLISHED to confirm content sync while preserving public lifecycle
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-editorial-sync
  cancel-in-progress: false

jobs:
  sync:
    if: inputs.confirmation == 'SYNC-100-PUBLISHED'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Validate release SHA
        id: release
        env:
          RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
        run: |
          if [[ ! "$RELEASE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full 40-character Git commit SHA" >&2
            exit 1
          fi
          echo "sha=$RELEASE_SHA_INPUT" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Configure pinned SSH transport
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/tiendataudio_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/tiendataudio_deploy" "$HOME/.ssh/known_hosts"

      - name: Preflight, backup, sync and verify production data
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          AUDIT_ACTOR: ${{ github.actor }}
          AUDIT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ssh_args=(-i "$HOME/.ssh/tiendataudio_deploy" -p "$VPS_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" \
            "RELEASE_SHA='$RELEASE_SHA' AUDIT_ACTOR='$AUDIT_ACTOR' AUDIT_RUN_URL='$AUDIT_RUN_URL' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          release_dir="/srv/tiendataudio/releases/$RELEASE_SHA"
          test -d "$release_dir"
          test "$(readlink -f /srv/tiendataudio/current)" = "$release_dir"
          cd "$release_dir"
          set -a
          source /etc/tiendataudio/tiendataudio.env
          set +a
          export EDITORIAL_CORPUS_TARGET=production
          export EDITORIAL_CORPUS_CONFIRM=SYNC-100-PUBLISHED
          export EDITORIAL_CORPUS_PRESERVE_LIFECYCLE=1
          export EDITORIAL_BATCH_TARGET=production
          export EDITORIAL_BATCH_CONFIRM=SYNC-100-PUBLISHED
          export EDITORIAL_BATCH_PRESERVE_LIFECYCLE=1

          npm run db:complete-editorial
          npm run db:apply-editorial-batch

          backup_dir=/srv/tiendataudio/shared/db-backups
          install -d -m 0700 "$backup_dir"
          backup_stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          backup_archive="$backup_dir/tiendataudio-editorial-sync-$backup_stamp.archive.gz"
          mongodump --quiet --uri="$MONGODB_URI" --archive="$backup_archive" --gzip
          sha256sum "$backup_archive" > "$backup_archive.sha256"

          npm run db:complete-editorial -- --apply
          npm run db:apply-editorial-batch -- --apply
          export EDITORIAL_QA_ALLOW_REMOTE=1
          export EDITORIAL_QA_MODE=production
          npm run db:qa-editorial

          printf '{"timestamp":"%s","release":"%s","actor":"%s","run_url":"%s","operation":"editorial-sync","status":"success","backup":"%s"}\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$RELEASE_SHA" "$AUDIT_ACTOR" "$AUDIT_RUN_URL" "$backup_archive" \
            >> /srv/tiendataudio/deployments.jsonl
          REMOTE

      - name: Remove runner credential
        if: always()
        run: rm -f "$HOME/.ssh/tiendataudio_deploy"
