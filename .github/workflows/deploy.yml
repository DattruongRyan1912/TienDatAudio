name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Resolve release SHA
        id: release
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          release_sha="${WORKFLOW_RUN_SHA:-$DISPATCH_SHA}"
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA" >&2
            exit 1
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout verified release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Setup Node.js for manual verification
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify manually dispatched release
        if: github.event_name == 'workflow_dispatch'
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: https://tiendataudioquangngai.id.vn
        run: |
          npm ci
          bash deploy/scripts/audit-secrets.sh
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run build

      - name: Configure pinned SSH transport
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/tiendataudio_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/tiendataudio_deploy" "$HOME/.ssh/known_hosts"

      - name: Upload immutable release
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh_args=(-i "$HOME/.ssh/tiendataudio_deploy" -p "$VPS_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "mkdir -p /srv/tiendataudio/releases/$RELEASE_SHA"
          rsync -az \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.next/' \
            --exclude 'node_modules/' \
            --exclude '.env*' \
            -e "ssh -i $HOME/.ssh/tiendataudio_deploy -p $VPS_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./ "$VPS_USER@$VPS_HOST:/srv/tiendataudio/releases/$RELEASE_SHA/"

      - name: Configure private AI runtime
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$DEEPSEEK_API_KEY"
          [[ "$DEEPSEEK_API_KEY" =~ ^sk-[A-Za-z0-9_-]+$ ]]
          {
            printf 'DEEPSEEK_API_KEY=%s\n' "$DEEPSEEK_API_KEY"
            printf 'DEEPSEEK_MODEL=deepseek-v4-flash\n'
            printf 'DEEPSEEK_BASE_URL=https://api.deepseek.com\n'
          } | ssh -i "$HOME/.ssh/tiendataudio_deploy" -p "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'umask 077; runtime_file=/srv/tiendataudio/shared/runtime-ai.env; temporary_file="${runtime_file}.tmp"; cat > "$temporary_file"; chmod 0600 "$temporary_file"; mv -f "$temporary_file" "$runtime_file"'

      - name: Activate and verify release
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          AUDIT_ACTOR: ${{ github.actor }}
          AUDIT_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ssh -i "$HOME/.ssh/tiendataudio_deploy" -p "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash /srv/tiendataudio/releases/$RELEASE_SHA/deploy/scripts/deploy-release.sh '$RELEASE_SHA' '$AUDIT_ACTOR' '$AUDIT_RUN_URL'"

      - name: Remove runner credential
        if: always()
        run: rm -f "$HOME/.ssh/tiendataudio_deploy"
